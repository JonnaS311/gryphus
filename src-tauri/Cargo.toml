[package]
name = "gryphus-desktop"
description = "Binario Tauri de Gryphus: composition root, comandos IPC y gestion de ventanas."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[lib]
# Sufijo _lib para evitar colision de nombres entre lib y bin en Windows.
name = "gryphus_desktop_lib"
crate-type = ["rlib"]

[[bin]]
name = "gryphus"
path = "src/main.rs"

[features]
# Sirve el frontend embebido (ui/dist) en lugar de devUrl. `cargo tauri build`
# lo activa; las pruebas e2e también.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
tauri = { workspace = true }
tauri-plugin-dialog = { workspace = true }
arboard = { workspace = true }
trash = { workspace = true }
gryphus-core = { workspace = true }
gryphus-app = { workspace = true }
gryphus-ipc = { workspace = true }
gryphus-git = { workspace = true }
gryphus-agents = { workspace = true }
gryphus-fs = { workspace = true }
gryphus-store = { workspace = true }

[dev-dependencies]
gryphus-testkit = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
