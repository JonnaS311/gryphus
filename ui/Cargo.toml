[package]
name = "gryphus-ui"
description = "Frontend de Gryphus en Leptos (CSR, WASM). Solo depende de gryphus-ipc."
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
gryphus-ipc = { workspace = true }
leptos = { workspace = true }
console_error_panic_hook = { workspace = true }
serde = { workspace = true }
serde-wasm-bindgen = "0.6"
futures-channel = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window",
    "Performance",
    "Response",
    "Storage",
    "Document",
    "Element",
    "HtmlElement",
    "HtmlInputElement",
    "CssStyleDeclaration",
    "Event",
    "EventTarget",
    "KeyboardEvent",
    "Navigator",
] }

[lints]
workspace = true
