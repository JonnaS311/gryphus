name: Release

# Publicar una versión:
#   1. Sube `version` en [workspace.package] de Cargo.toml (p. ej. 0.2.0) y haz commit.
#   2. git tag v0.2.0 && git push origin v0.2.0
# El release se crea en borrador, se adjuntan los instaladores y solo se publica
# si todas las plataformas compilan. Las versiones 0.x y las que llevan sufijo
# (v1.0.0-rc.1) se marcan como pre-release.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  create:
    name: crear release (borrador)
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@v7

      - name: El tag coincide con la versión de Cargo.toml
        run: |
          version=$(sed -n '/^\[workspace.package\]/,/^\[/{s/^version = "\(.*\)"/\1/p}' Cargo.toml)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::El tag $GITHUB_REF_NAME no coincide con la versión $version de Cargo.toml"
            exit 1
          fi

      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=false
          if [[ "$GITHUB_REF_NAME" == v0.* || "$GITHUB_REF_NAME" == *-* ]]; then prerelease=true; fi
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" \
            -f tag_name="$GITHUB_REF_NAME" \
            -f name="Gryphus $GITHUB_REF_NAME" \
            -F draft=true \
            -F prerelease=$prerelease \
            -F generate_release_notes=true \
            --jq .id)
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    name: build (${{ matrix.platform }})
    needs: create
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04: glibc más antigua = AppImage/.deb compatibles con más distros
          - platform: ubuntu-22.04
          - platform: windows-latest
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: Dependencias de sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk,tauri-cli

      - uses: tauri-apps/tauri-action@action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          releaseId: ${{ needs.create.outputs.id }}
          tauriScript: cargo tauri
          projectPath: src-tauri

  publish:
    name: publicar release
    needs: [create, build]
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/${{ needs.create.outputs.id }}" -F draft=false
