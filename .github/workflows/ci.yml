name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Dependencias de sistema (Tauri en Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Toolchain (rust-toolchain.toml)
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: trunk

      - name: Formato
        run: cargo fmt --all --check

      # src-tauri necesita ui/dist para compilar (frontendDist)
      - name: Build de la UI (WASM)
        run: trunk --config ui/Trunk.toml build

      - name: Clippy (nativo)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Clippy (UI en wasm32)
        run: cargo clippy -p gryphus-ui --target wasm32-unknown-unknown -- -D warnings

      - name: Pruebas
        run: cargo test --workspace

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pegamento JS (decodificador)
        working-directory: ui/js
        run: npm ci && npm test

  e2e:
    name: e2e (${{ matrix.os }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      GRYPHUS_E2E: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Dependencias de sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf webkit2gtk-driver xvfb

      - name: msedgedriver igual a WebView2 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $v = (Get-ItemProperty 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}').pv
          $dir = "target/e2e-tools/msedgedriver-$v"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Invoke-WebRequest "https://msedgedriver.microsoft.com/$v/edgedriver_win64.zip" -OutFile "$dir/driver.zip"
          Expand-Archive "$dir/driver.zip" -DestinationPath $dir -Force

      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk,tauri-driver

      - name: E2E (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run cargo test -p gryphus-e2e -- --nocapture

      - name: E2E (Windows)
        if: runner.os == 'Windows'
        run: cargo test -p gryphus-e2e -- --nocapture

      - name: Capturas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screens-${{ matrix.os }}
          path: target/e2e-screens
          if-no-files-found: ignore
