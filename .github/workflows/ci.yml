name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# En un PR, un push nuevo cancela la ejecución anterior. En main cada commit
# tiene su propio grupo y termina siempre: con un grupo compartido, GitHub
# cancelaría la ejecución pendiente aunque cancel-in-progress fuera false.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macos-latest es Apple Silicon (arm64).
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Dependencias de sistema (Tauri en Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Toolchain (rust-toolchain.toml)
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: trunk

      - name: Formato
        run: cargo fmt --all --check

      # src-tauri necesita ui/dist para compilar (frontendDist)
      - name: Build de la UI (WASM)
        run: trunk --config ui/Trunk.toml build

      - name: Clippy (nativo)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Clippy (UI en wasm32)
        run: cargo clippy -p gryphus-ui --target wasm32-unknown-unknown -- -D warnings

      # --no-fail-fast: si falla un binario de pruebas, los demás se ejecutan igual
      - name: Pruebas
        run: cargo test --workspace --no-fail-fast

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/js/package-lock.json

      - name: Pegamento JS (decodificador)
        working-directory: ui/js
        run: npm ci && npm test

  # E2E (tauri-driver) desactivado temporalmente en CI: falla en los runners de
  # Windows y Linux (issue #6). Se sigue ejecutando en local con GRYPHUS_E2E=1
  # (ver docs/testing.md).
