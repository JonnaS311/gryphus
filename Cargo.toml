[workspace]
resolver = "2"
members = ["crates/*", "src-tauri", "ui", "tools/*", "e2e"]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"
repository = "https://github.com/JonnaS311/gryphus"

[workspace.dependencies]
# Cada hito añade aquí sus dependencias cuando las usa (Cargo avisa de las no usadas).
# Crates internos (solo los que otro crate ya usa)
gryphus-core = { path = "crates/gryphus-core" }
gryphus-app = { path = "crates/gryphus-app" }
gryphus-ipc = { path = "crates/gryphus-ipc" }
gryphus-git = { path = "crates/gryphus-git" }
gryphus-agents = { path = "crates/gryphus-agents" }
gryphus-fs = { path = "crates/gryphus-fs" }
gryphus-store = { path = "crates/gryphus-store" }
gryphus-testkit = { path = "crates/gryphus-testkit" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
proptest = "1"
tempfile = "3"
criterion = "0.5"
notify = "8"
ignore = "0.4"
toml = "0.8"
portable-pty = "0.9"
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
tauri-plugin-dialog = "2"
leptos = { version = "0.8", features = ["csr"] }
console_error_panic_hook = "0.1"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = true
codegen-units = 1

# La UI se optimiza por tamaño del WASM; el backend por velocidad.
[profile.release.package.gryphus-ui]
opt-level = "z"
