[workspace]
resolver = "2"
members = ["crates/*", "src-tauri", "ui", "tools/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

[workspace.dependencies]
# Cada hito añade aquí sus dependencias cuando las usa (Cargo avisa de las no usadas).
# Los crates internos se declaran también aquí, p. ej.:
# gryphus-core = { path = "crates/gryphus-core" }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
leptos = { version = "0.8", features = ["csr"] }
console_error_panic_hook = "0.1"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = true
codegen-units = 1

# La UI se optimiza por tamaño del WASM; el backend por velocidad.
[profile.release.package.gryphus-ui]
opt-level = "z"
